name: Release

#stlen blatently from Ktisis: https://github.com/ktisis-tools/Ktisis/blob/main/.github/workflows/release.yml

# Add a concurrency group incase a tag is created, deleted, and then recreated while a release is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only run this workflow when a tag is pushed when the tag starts with "v" or when run manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# So we can use the GitHub API to create releases with the run token.
permissions:
  contents: write

jobs:
  Release:
    if: github.event.pull_request.draft == false # Ignore draft PRs
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
        shell: bash
    env:
      DALAMUD_HOME: ${{ github.workspace }}/Lib/Dalamud
      IsCI: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true # Grab any submodules that may be required
          
      - name: Download Dalamud
        uses: gamedev-thingy/Download-Extract@v2
        with:
          url: "https://goatcorp.github.io/dalamud-distrib/latest.zip"
          destination: ${{ env.DALAMUD_HOME }}
          ZIPname: latest

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build plugin in release mode
        run: dotnet build -c Release --no-restore --nologo

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.6.0
        with:
          filename: '${{ github.workspace }}/latest.zip'
          directory: './ScreenshotStudio/bin/'
          exclusions: '*.pdb* *.xml*'

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: '${{ github.workspace }}/latest.zip'
          name: ${{github.run_number}}
          tag: v${{github.run_number}}
          #body: ${{ steps.Changelog.outputs.changelog }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
            
      - name: Update repo.json
        uses: DamianReeves/write-file-action@master
        with:
          path: repo.json
          write-mode: overwrite
          contents: |
            [
              {
                  "Author": "Xiv Tools",
                  "Name": "Screenshot Studio",
                  "InternalName": "ScreenshotStudio",
                  "Description": "A plugin for enhancing GPose functionality",
                  "AssemblyVersion": "1.0.0.${{github.run_number}}",
                  "TestingAssemblyVersion": "1.0.0.${{github.run_number}}",
                  "RepoUrl": "https://github.com/XIV-Tools/ScreenshotStudio",
                  "ApplicableVersion": "any",
                  "DalamudApiLevel": 8,
                  "Tags": [
                    "gpose",
                    "posing",
                    "screenshot"
                  ],
                  "IconUrl": "https://github.com/XIV-Tools/ScreenshotStudio/blob/main/Assets/Icon/light-pride.png",
                  "DownloadLinkInstall": "https://github.com/XIV-Tools/ScreenshotStudio/releases/download/v${{github.run_number}}/latest.zip",
                  "DownloadLinkTesting": "https://github.com/XIV-Tools/ScreenshotStudio/releases/download/v$${{github.run_number}}/latest.zip",
                  "DownloadLinkUpdate": "https://github.com/XIV-Tools/ScreenshotStudio/releases/download/v$${{github.run_number}}/latest.zip",
                }
              ]
          
  
      - name: Update repo.json
        run: |
          git add repo.json
          git config --local user.name "github-actions [bot]"
          git config --local user.email "github-actions@users.noreply.github.com"
          git commit -m "Update repo.json for ${{ github.ref_name }}"
          
          git push origin HEAD:main
