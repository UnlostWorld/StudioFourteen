name: Release

# Add a concurrency group incase a tag is created, deleted, and then recreated while a release is in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only run this workflow when a tag is pushed when the tag starts with "v" or when run manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# So we can use the GitHub API to create releases with the run token.
permissions:
  contents: write

jobs:
  Release:
    if: github.event.pull_request.draft == false # Ignore draft PRs
    runs-on: windows-latest

    defaults:
      run:
        working-directory: .
    env:
      IsCI: true
      DALAMUD_HOME: '${{ github.workspace }}/../Dalamud/'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true # Grab any submodules that may be required

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip '${{ github.workspace }}/../Dalamud/'

      #- name: Setup .NET
      #  uses: actions/setup-dotnet@v3
      #  with:
      #    dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Navigate to Workspace
        run: cd $GITHUB_WORKSPACE

      - name: Build Solution
        run: |
          msbuild.exe StudioFourteen.sln -nologo -nr:false -p:platform="x64" -p:configuration="Release" -Restore

      - name: Zip Release
        uses: TheDoctor0/zip-release@0.6.0
        with:
          filename: '${{ github.workspace }}/latest.zip'
          directory: './StudioFourteen/bin/'
          exclusions: '*.pdb* *.xml*'

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: '${{ github.workspace }}/latest.zip'
          name: ${{github.run_number}}
          tag: v${{github.run_number}}
          #body: ${{ steps.Changelog.outputs.changelog }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
